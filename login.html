<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Router Manager — Sign in</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#e7edf7;font:16px system-ui,sans-serif}main{width:min(410px,calc(100% - 32px));padding:32px;border:1px solid #26344d;border-radius:16px;background:#111a2b;box-shadow:0 12px 30px #0005}h1{margin:0 0 8px;font-size:25px}p{color:#91a0b8;margin:0 0 25px}label{display:block;margin:15px 0 7px}input{width:100%;background:#0b1220;color:white;border:1px solid #40506a;border-radius:8px;padding:12px;font-size:16px}button{width:100%;margin-top:24px;padding:12px;border:0;border-radius:8px;background:#4f8cff;color:#fff;font-size:16px;cursor:pointer}button:disabled{opacity:.6}#error{min-height:1.4em;color:#ff8794;margin-top:12px}
</style></head><body><main><h1>Router Manager</h1><p>Sign in to manage your router.</p><form id="login"><label for="username">Username</label><input id="username" autocomplete="username" value="admin" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required autofocus><button id="submit">Sign in</button><div id="error" role="alert"></div></form></main><script>
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submit');btn.disabled=true;document.getElementById('error').textContent='';try{const response=await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});if(!response.ok)throw Error(response.status===429?'Too many attempts. Try again later.':'Invalid username or password');window.location.replace('/');}catch(err){document.getElementById('error').textContent=err.message;btn.disabled=false;}});
</script></body></html>
